<!doctype html>
<html lang="en">
  <head>
    <script>
      ;(() => {
        let preferences = {}
        try {
          const persistedPreferences = localStorage.getItem('persist:preferences')
          preferences = persistedPreferences ? JSON.parse(persistedPreferences) : {}
        } catch {
          preferences = {}
        }

        const readPreference = (key) => {
          try {
            const value = preferences[key]
            return typeof value === 'string' ? JSON.parse(value) : value
          } catch {
            return undefined
          }
        }

        const savedTheme = readPreference('theme')
        const savedSegment = readPreference('segment')
        const theme =
          savedTheme === 'dark' || savedTheme === 'light'
            ? savedTheme
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        const segment = savedSegment === 'premium' ? 'premium' : 'retail'
        document.documentElement.dataset.theme = theme
        document.documentElement.dataset.segment = segment
      })()
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6fa" />
    <title>Meridian Banking</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
